# Thufir Default Configuration
# Copy to ~/.thufir/config.yaml and customize

# Gateway settings (inherited from Clawdbot)
gateway:
  port: 18789
  bind: loopback
  auth:
    mode: password  # Required for remote access

# Agent settings
agent:
  # Primary LLM model
  model: claude-sonnet-4-5-20251101
  # OpenAI model (used for info gathering + execution)
  openaiModel: gpt-5.2
  # Executor model (orchestrator pattern)
  executorModel: claude-sonnet-4-6
  executorProvider: anthropic
  useExecutorModel: false
  useOrchestrator: false
  showToolTrace: false
  showCriticNotes: false
  showPlanTrace: false
  showFragilityTrace: false
  persistPlans: true
  # Non-critical work is local-only; local failure degrades instead of spending remote quota.
  allowFallbackNonCritical: false
  alwaysIncludeTime: false
  proactiveRefresh:
    enabled: false
    intentMode: time_sensitive  # off | time_sensitive | always
    ttlSeconds: 900
    maxLatencyMs: 4500
    marketLimit: 20
    intelLimit: 5
    webLimit: 5
    strictFailClosed: true
    fundingSymbols: [BTC, ETH]
  identityPromptMode: full
  identityBootstrapMaxChars: 20000
  identityBootstrapIncludeMissing: true
  maxPromptChars: 120000
  maxToolResultChars: 8000
  internalPromptMode: minimal
  mentatAutoScan: false
  mentatSystem: Markets
  # Optional filters for mentat auto-scan
  # mentatMarketQuery: "macro"
  # mentatMarketLimit: 25
  # mentatIntelLimit: 40
  # Fallback model (faster, cheaper)
  fallbackModel: claude-3-5-haiku-20241022
  # Model provider: anthropic | openai | local
  provider: anthropic
  # OpenAI-compatible base URL (used for openai provider)
  apiBaseUrl: https://api.openai.com
  # Local (Ollama) base URL for local provider
  localBaseUrl: http://localhost:11434
  # Optional llm-mux proxy
  useProxy: false
  proxyBaseUrl: http://localhost:8317
  # Workspace directory
  workspace: ~/.thufir
  # Maximum thinking level
  thinkingLevel: high
  # Trivial task offload (local LLM)
  trivialTaskProvider: local
  trivialTaskModel: qwen2.5:1.5b-instruct
  # Controlled system-side-effect tools (install/exec)
  systemTools:
    enabled: false
    allowedCommands: [node, npm, pnpm, bun, qmd]
    allowedManagers: [pnpm, npm, bun]
    allowGlobalInstall: false
    timeoutMs: 120000
    maxOutputChars: 12000
  trivial:
    enabled: true
    maxTokens: 128
    temperature: 0.2
    timeoutMs: 20000
    # Empirically measured under realistic concurrent bursts (keep-warm + heartbeat +
    # telegram relevance screen landing together): tail wall-clock latency reaches ~19-26s
    # even though the model succeeds 100% of the time given enough budget. 20000ms clears
    # burst-of-5 scenarios and stays under Exit Consultant's own 25000ms outer race.
    localSoftTimeoutMs: 20000
    fallbackTimeoutMs: 8000
    keepWarmEnabled: true
    keepWarmIntervalSeconds: 180
    keepAlive: 30m
  # Per-call-kind prompt char budgets (controls trimMessagesByCharBudget ceiling)
  promptBudget:
    enrichment: 10000   # Autonomous enrichment/annotation synthesis — always short
    autonomous: 60000   # Autonomous primary reasoning calls
    trivial: 10000      # Trivial/local model calls
    chat: 120000        # Full conversation context (default)
  # Global LLM budget (rolling hour)
  llmBudget:
    enabled: true
    maxCallsPerHour: 120
    maxTokensPerHour: 120000
    reserveCalls: 10
    reserveTokens: 10000
    includeLocal: false

# Wallet configuration
wallet:
  # Encrypted keystore location
  keystorePath: ~/.thufir/keystore.json
  # Optional RPC URL for live execution adapters
  # rpcUrl: ""

  # Spending limits (USD)
  limits:
    daily: 100          # Max spend per day
    perTrade: 25        # Max per single trade
    confirmationThreshold: 10  # Require confirmation above this

  # Risk controls
  exposure:
    maxPositionPercent: 20   # Max % of portfolio in one market
    maxDomainPercent: 40     # Max % in one domain

  # Perp risk controls
  perps:
    maxOrderNotionalUsd: 250    # Max notional per perp order (USD)
    maxTotalNotionalUsd: 1000   # Max total perp notional across positions (USD)
    minLiquidationDistanceBps: 500 # Minimum liquidation distance (bps) when data available
    sameSideExposureCaps:
      maxOpenPositions: 3       # Max concurrent longs or shorts before blocking more in the same direction
      maxTotalNotionalUsd: 500  # Max total notional for one-sided books (all longs or all shorts)
    correlationCaps: []         # Optional: [{ name, symbols, maxNotionalUsd }]

  # Loss protection
  cooldown:
    lossThresholdPercent: 10  # Trigger at 10% daily loss
    durationSeconds: 3600     # 1 hour cooldown

# Technical analysis (short-term crypto)
technical:
  enabled: false
  priceSource: binance
  symbols:
    - 'BTC/USDT'
    - 'ETH/USDT'
  timeframes:
    - '1h'
    - '4h'
    - '1d'
  indicators:
    rsi:
      period: 14
      overbought: 70
      oversold: 30
    macd:
      fast: 12
      slow: 26
      signal: 9
    bollingerBands:
      period: 20
      stdDev: 2
  signals:
    minConfidence: 0.5
    weights:
      technical: 0.5
      news: 0.3
      onChain: 0.2
  onChain:
    enabled: false
    coinglassApiKey: ""

# Reflexivity detector (crowding + fragility + catalyst)
reflexivity:
  enabled: false
  horizonSeconds: 86400          # 24h
  catalystsFile: config/catalysts.yaml
  edgeScale: 0.2
  weights:
    crowding: 0.4
    fragility: 0.4
    catalyst: 0.2
  thresholds:
    setupScoreMin: 0.7
  narrative:
    maxIntelItems: 50
    cacheTtlSeconds: 1800        # 30m
    llm:
      enabled: false             # set true to use LLM JSON extraction
      useTrivial: true           # use local/trivial client when available

# Execution mode
execution:
  # paper = simulated trades, webhook = forward orders to external executor
  mode: paper
  provider: hyperliquid
  webhookUrl: ""

paper:
  enabled: true
  initialCashUsdc: 300
  defaultMode: paper
  requireExplicitLive: true
  liveSymbolsAllowlist: []  # No restriction — all discovered markets eligible for live execution
  promotionGates:
    minTrades: 25
    maxDrawdownR: 6
    minHitRate: 0.5
    minPayoffRatio: 1.2
    minExpectancyR: 0.1

# Channel integrations
channels:
  telegram:
    enabled: false
    token: ""          # TELEGRAM_BOT_TOKEN
    allowedChatIds: [] # Restrict to these chat IDs (optional)
    pollingInterval: 5 # seconds
    monitor:
      enabled: false
      apiId: 0           # Telegram API ID — from https://my.telegram.org
      apiHash: ""        # Telegram API hash — from https://my.telegram.org
      phone: ""          # Phone number used to authenticate (E.164, e.g. +44...)
      sessionString: ""  # Populated by scripts/telegram_monitor_auth.ts
      channels:          # Public channel usernames to monitor (without @)
        - marketfeed
      breakingNewsKeywords: []        # Extra keywords that trigger immediate scan
      eventDrivenScanEnabled: true    # Fire autonomous scan on breaking-news match
  whatsapp:
    enabled: false
    verifyToken: ""     # WHATSAPP_VERIFY_TOKEN
    accessToken: ""     # WHATSAPP_ACCESS_TOKEN
    phoneNumberId: ""   # WHATSAPP_PHONE_NUMBER_ID
    allowedNumbers: []  # E.164 numbers allowed to chat (optional)

# Autonomous scan loop
autonomy:
  enabled: false
  scanIntervalSeconds: 900
  maxMarketsPerScan: 10
  watchlistOnly: true
  eventDriven: false
  eventDrivenMinItems: 1
  eventDrivenHeartbeat: true
  strategy: discovery
  probeRiskFraction: 0.15

  # Full autonomous mode (auto-executes trades)
  fullAuto: false              # Master toggle for auto-execution
  minEdge: 0.05                # Minimum edge to trade (5%) — weak setups should not reach execution
  requireHighConfidence: true  # Require both edge and conviction, not just one
  pauseOnLossStreak: 3         # Pause after N consecutive losses
  dailyReportTime: "20:00"     # Time to send daily P&L report
  maxTradesPerScan: 1          # Concentrate on the single best setup per scan
  exposure:
    enabled: true              # Deterministic portfolio guard before LLM entry gate
    maxGrossLeverage: 3.0      # Total open notional <= 3x account equity/cash
    maxNetLeverage: 2.0        # Absolute directional net <= 2x account equity/cash
    maxClusterPercent: 75      # Per-cluster notional cap as % of account equity/cash
    clusters:
      crypto-majors: [BTC, ETH, SOL]
      crypto-alt: [AVAX, DOGE, LINK, MATIC, OP, ARB, APT, SUI, SEI, INJ, FET, TIA, NEAR, UNI, AAVE]
      us-equity: [SPX, NDX, NASDAQ, DOW, RUSSELL, TSLA, NVDA, AAPL, MSFT, META, AMZN, GOOGL]
      energy:
        oil: [CL, BRENTOIL, WTI, BRENT]
        gas: [NG, NATGAS]
      metals:
        gold: [XAU, GOLD]
        silver: [XAG, SILVER]
        copper: [HG, COPPER]
      fx-macro:
        usd: [DXY, USD]
        eur: [EUR, EURUSD]
        jpy: [JPY, USDJPY]
        gbp: [GBP, GBPUSD]
  tradeContract:
    enabled: false             # Enforce entry trade contract (archetype/invalidation/time stop)
    enforceExitFsm: false      # Require reason-coded reduce-only exits (manual needs emergency override)
  tradeQuality:
    enabled: false             # Segment gate from rolling decision component quality
    minSamples: 12
    blockBelowScore: 0.45
    downweightBelowScore: 0.60
    downweightMultiplier: 0.60
  adaptiveEdge:
    enabled: true              # Replace synthetic confidence*0.1 with history-grounded edge
    priorEdge: 0.05            # Edge used before minSamples reached per segment (5%) — matches minEdge so cold-start produces candidates
    minSamples: 10             # Closed trades needed before empirical estimate kicks in
    signalScaleFactor: 0.5     # How much discovery confidence modulates edge (0=ignore, 1=full)
    decayHalfLifeDays: null    # Time decay for old trades (null=off until enough data)
  discoverySelection:
    enabled: true
    fullUniverseWhenSymbolsEmpty: true  # If hyperliquid.symbols is [], rank full perp universe
    preselectLimit: 24                  # Expensive signal stack only runs on these top-ranked symbols
    minOpenInterestUsd: 5000000
    minDayVolumeUsd: 20000000
  llmEntryGate:
    enabled: true
    primaryTimeoutMs: 45000
    fallbackTimeoutMs: 25000
    timeoutMs: 5000
    rejectOnBothFail: true
    gateCooldownMinutes: 60
    deterministicPrechecks: true
  ta:
    oiSpikePct: 4
    fundingExtremeAnnual: 25
    volumeSpikePct: 80
  origination:
    enabled: true
    cadenceMinutes: 15
    topMarketsCount: 20
    quantFallbackEnabled: true
    timeoutMs: 10000
    minConfidence: 0.55
    cooldownMinutes: 30

# v1.2: Position heartbeat (risk management loop)
# Alerts are generated by the trivial/local LLM and sent via Telegram.
heartbeat:
  enabled: true
  tickIntervalSeconds: 30
  rollingBufferSize: 60
  triggers:
    pnlShiftPct: 1.5
    liquidationProximityPct: 5.0
    volatilitySpikePct: 2.0
    volatilitySpikeWindowTicks: 10
    timeCeilingMinutes: 0
    triggerCooldownSeconds: 180
  llmExitConsult:
    enabled: true
    firstConsultMinutes: 20
    cadenceMinutes: 20
    minConsultSpacingMinutes: 5
    maxCallsPerPositionPerHour: 3
    roeThresholds: [3, 7, 15]
    approachTtlMinutes: 15
    primaryTimeoutMs: 30000
    fallbackTimeoutMs: 25000
    timeoutMs: 8000
  dynamicProfitProtection:
    enabled: true
    minRMultiple: 4
    minRoePct: 12
    partialReduceRMultiple: 5.5
    tightenAndReduceRMultiple: 7
    terminalCloseRMultiple: 9
    adverseMovePct: 1.5
    terminalAdverseMovePct: 2.5

# Trade management (exchange-native risk controls)
tradeManagement:
  enabled: false
  defaults:
    stopLossPct: 3.0
    takeProfitPct: 5.0
    maxHoldHours: 72
  bounds:
    stopLossPct: { min: 1.0, max: 8.0 }
    takeProfitPct: { min: 2.0, max: 15.0 }
    maxHoldHours: { min: 1, max: 168 }
  monitorIntervalSeconds: 900
  activeMonitorIntervalSeconds: 60
  useExchangeStops: true
  liquidationGuardDistanceBps: 800
  closeRetryMinSeconds: 30
  dustMaxRemainingNotionalUsd: 0.5

# Memory persistence
memory:
  dbPath: ~/.thufir/thufir.sqlite
  sessionsPath: ~/.thufir/sessions
  maxHistoryMessages: 50
  compactAfterTokens: 12000
  keepRecentMessages: 12
  retentionDays: 90
  embeddings:
    enabled: false
    provider: openai     # openai | google
    model: text-embedding-3-small
    apiBaseUrl: https://api.openai.com

# Session routing (Clawdbot-style)
session:
  mainKey: main
  dmScope: per-channel-peer  # main | per-peer | per-channel-peer
  identityLinks: {}

# Multi-agent routing (optional)
# agents:
#   defaultAgentId: main
#   agentIds: [main, research]
#   routes:
#     - agentId: research
#       channel: telegram
#       peerIds: ["123456789"]
#   overrides:
#     research:
#       agent:
#         model: claude-sonnet-4-5-20251101
#       autonomy:
#         enabled: false

# Notifications / schedulers
notifications:
  briefing:
    enabled: false
    time: "08:00"
    channels: []
  dailyReport:
    enabled: false
    channels: []
  resolver:
    enabled: true
    intervalSeconds: 900
    limit: 50
  intelFetch:
    enabled: false
    time: "06:00"
  marketSync:
    enabled: false
    time: "07:00"
    limit: 200
    maxPages: 25
    refreshLimit: 500
    # Set to run on a fixed interval instead of once per day
    # intervalSeconds: 900
  proactiveSearch:
    enabled: false
    mode: schedule
    time: "07:30"
    maxQueries: 8
    iterations: 2
    watchlistLimit: 20
    useLlm: true
    recentIntelLimit: 25
    extraQueries: []
    includeLearnedQueries: true
    learnedQueryLimit: 8
    webLimitPerQuery: 5
    fetchPerQuery: 1
    fetchMaxChars: 4000
    channels: []
  heartbeat:
    enabled: false
    intervalMinutes: 30
    timeoutMs: 10000
    degradedMode: ok
    storeHistory: false
    includeProactiveSummary: true
    channels: []
    target: last
  intelAlerts:
    enabled: false
    channels: []
    watchlistOnly: true
    maxItems: 10
    includeSources: []
    excludeSources: []
    includeKeywords: []
    excludeKeywords: []
    minKeywordOverlap: 1
    minTitleLength: 8
    # minSentiment: -1
    # maxSentiment: 1
    sentimentPreset: any
    includeEntities: []
    excludeEntities: []
    minEntityOverlap: 1
    useContent: true
    minScore: 0
    keywordWeight: 1
    entityWeight: 1
    sentimentWeight: 1
    positiveSentimentThreshold: 0.05
    negativeSentimentThreshold: -0.05
    showScore: false
    showReasons: false
    entityAliases: {}
  mentat:
    enabled: false
    time: "09:00"
    # intervalMinutes: 60
    channels: []
    system: Hyperliquid
    # marketQuery: "macro"
    marketLimit: 25
    intelLimit: 40
    minOverallScore: 0.7
    minDeltaScore: 0.15
    # schedules:
    #   - name: hourly
    #     intervalMinutes: 60
    #     marketLimit: 15
    #     intelLimit: 20
    #   - name: daily
    #     time: "09:00"
    #     marketLimit: 25
    #     intelLimit: 40
  escalation:
    enabled: false
    channels: []
    actionableReasons:
      - risk_breach
      - stop_failure
      - abnormal_slippage
      - high_conviction_setup
    dedupeWindowSeconds: 300
    cooldownSeconds: 900
    severityChannels:
      info: []
      warning: []
      high: []
      critical: []
    llmEnrichment:
      enabled: false
      timeoutMs: 2500
      maxTokens: 140
      temperature: 0.1
      maxChars: 420

# QMD local knowledge search
# QMD provides hybrid search (BM25 + vector + LLM reranking) for local knowledge
qmd:
  enabled: true
  knowledgePath: ~/.thufir/knowledge
  collections:
    - name: thufir-research
      description: Web search results and articles for market research
    - name: thufir-intel
      description: News, social media intel, market commentary
    - name: thufir-markets
      description: Market analysis and trading notes
  # Auto-index web search results
  autoIndexWebSearch: true
  # Auto-index fetched web pages
  autoIndexWebFetch: false
  # Periodic embedding update schedule
  embedSchedule:
    enabled: true
    intervalMinutes: 60  # Run qmd embed every hour

# Intel sources
intel:
  embeddings:
    enabled: false
    provider: openai     # openai | google
    model: text-embedding-3-small
    apiBaseUrl: https://api.openai.com
  retentionDays: 30
  webSearch:
    enabled: true
    providers:
      order: [tavily, brave, serpapi, duckduckgo] # tavily | brave | perplexity | serpapi | duckduckgo
      tavily:
        enabled: true
        apiKey: ${TAVILY_API_KEY}
      brave:
        enabled: true
        apiKey: ${BRAVE_API_KEY}
      perplexity:
        enabled: false
        apiKey: ${PERPLEXITY_API_KEY}
      serpapi:
        enabled: true
        apiKey: ${SERPAPI_KEY}
      duckduckgo:
        enabled: false
    cache:
      enabled: true
      ttlSeconds: 900
      maxEntries: 5000
    budgets:
      maxQueriesPerDay: 500
      perProviderDailyCaps: {}
    circuitBreaker:
      failureThreshold: 5
      openSeconds: 300

  # Sources (configure API keys in environment)
  sources:
    # RSS feeds (free)
    rss:
      enabled: true
      feeds:
        - url: https://fivethirtyeight.com/feed/
          category: politics
        - url: https://www.federalreserve.gov/feeds/press_all.xml
          category: economics
        - url: https://techcrunch.com/feed/
          category: technology

    # NewsAPI
    newsapi:
      enabled: false
      apiKey: ${NEWSAPI_KEY}
      categories: []
      countries: []
      queries: []
      maxArticlesPerFetch: 50
      language: en

    # Google News via SerpAPI
    googlenews:
      enabled: false
      serpApiKey: ${SERPAPI_KEY}
      queries: []
      country: us
      language: en
      maxArticlesPerFetch: 20

    # Twitter/X
    twitter:
      enabled: false
      bearerToken: ${TWITTER_BEARER}
      keywords: []
      accounts: []
      maxTweetsPerFetch: 25

  # Roaming controls for proactive search
  roaming:
    enabled: true
    allowSources: []
    allowTypes: []
    minTrust: medium
    socialOptIn: true

learning:
  # Excludes pre-v2.5 bug-era/runtime-contaminated rows from originator scorecards.
  cleanDataCutoff: '2026-06-13'

# Hyperliquid settings
hyperliquid:
  enabled: true
  baseUrl: https://api.hyperliquid.xyz
  wsUrl: wss://api.hyperliquid.xyz/ws
  accountAddress: ""
  privateKey: ""
  defaultSlippageBps: 10
  maxLeverage: 50  # Ceiling the LLM entry gate may suggest; 1x is always the floor
  symbols: []  # Full-universe discovery: selectDiscoveryMarkets ranks all perps by OI/volume/spread
